server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any unknown path must return index.html so the
    # React side can handle it. Without this, hitting /reset?token=...
    # directly would 404 — nginx would look for a file called "reset".
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames never change contents, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}