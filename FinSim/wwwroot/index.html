<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8/dist/browser/signalr.min.js"></script>
<pre id="out"></pre>
<script>
  const c = new signalR.HubConnectionBuilder().withUrl("http://localhost:5209/hubs/prices").build();
  c.on("PriceUpdate", d => document.getElementById("out").textContent = JSON.stringify(d, null, 2));
  c.start();
</script>
